<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gotya Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f3ea;
      --surface: #fffdf7;
      --surface-strong: #fff;
      --border: rgba(55, 47, 34, 0.16);
      --border-strong: rgba(55, 47, 34, 0.38);
      --text: #211d16;
      --muted: #766d60;
      --hint: rgba(55, 47, 34, 0.38);
      --accent: #1f6a52;
      --accent-soft: #deefe8;
      --danger: #a33d2f;
      --danger-soft: rgba(163, 61, 47, 0.08);
      --radius: 16px;
      --mono: 'DM Mono', 'Courier New', monospace;
      --ui: system-ui, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(31, 106, 82, 0.08), transparent 26%),
        linear-gradient(180deg, #f9f6ee 0%, var(--bg) 100%);
      color: var(--text);
      font-family: var(--ui);
      min-height: 100vh;
      padding: 24px 24px 80px;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* ── Views ──────────────────────────────────────────────────────────────── */

    .view { }
    .view.hidden { display: none; }
    .hidden { display: none; }

    /* ── Page header ────────────────────────────────────────────────────────── */

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 0.5px solid var(--border);
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Store grid (landing) ───────────────────────────────────────────────── */

    .store-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }

    @media (min-width: 560px) {
      .store-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (min-width: 860px) {
      .store-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .store-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      width: 100%;
    }

    .store-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 2px 8px rgba(55, 47, 34, 0.08);
      transform: translateY(-1px);
    }

    .store-card.archived {
      opacity: 0.65;
    }

    .store-card-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent-soft);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .store-card-logo img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      display: block;
    }

    .logo-initial {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .store-card-body {
      flex: 1;
      min-width: 0;
    }

    .store-card-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .store-card-arrow {
      color: var(--hint);
      font-size: 16px;
      flex-shrink: 0;
    }

    /* ── Status badges ──────────────────────────────────────────────────────── */

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-active   { background: var(--accent-soft); color: var(--accent); }
    .badge-archived { background: var(--danger-soft); color: var(--danger); }

    /* ── Create store form (landing) ────────────────────────────────────────── */

    .create-store-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* ── Back navigation ────────────────────────────────────────────────────── */

    .back-nav {
      margin-bottom: 20px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--ui);
      cursor: pointer;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.1s;
    }

    .back-btn:hover { color: var(--text); }

    /* ── Store detail header ────────────────────────────────────────────────── */

    .store-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .store-detail-layout {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .store-detail-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .store-detail-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: var(--accent-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .store-detail-logo img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      display: block;
    }

    .logo-initial-lg {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .store-detail-info {
      flex: 1;
      min-width: 0;
    }

    .store-name-display {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .store-detail-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .store-name-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .store-name-edit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    /* ── Detail sections ────────────────────────────────────────────────────── */

    .detail-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px 24px;
      margin-bottom: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--border);
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }

    .section-title-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--hint);
      margin-left: 6px;
    }

    /* ── Directory rows ─────────────────────────────────────────────────────── */

    .dir-list {
      display: flex;
      flex-direction: column;
      max-height: 420px;
      overflow-y: auto;
    }

    .dir-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .dir-row:last-child { border-bottom: none; }

    .dir-info { flex: 1; min-width: 0; }

    .dir-name {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .dir-sub {
      display: block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      word-break: break-all;
    }

    .dir-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* ── Forms ──────────────────────────────────────────────────────────────── */

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      font-family: var(--ui);
      background: var(--surface-strong);
      color: var(--text);
      outline: none;
    }

    .input:focus { border-color: var(--border-strong); }
    .input-grow { flex: 1; min-width: 140px; }
    .input-pts { width: 80px; }

    /* ── Buttons ────────────────────────────────────────────────────────────── */

    .btn-primary {
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: white;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s;
    }

    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { background: #3a3529; }

    .btn-sm {
      border: 1px solid var(--border-strong);
      background: var(--surface-strong);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .btn-sm:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-danger-sm {
      border: 1px solid transparent;
      background: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--danger);
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.1s;
    }

    .btn-danger-sm:hover { background: var(--danger-soft); }
    .btn-danger-sm:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Role badge ─────────────────────────────────────────────────────────── */

    .role-badge {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 8px;
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ── Reward rules ───────────────────────────────────────────────────────── */

    .rules-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      max-height: 400px;
      overflow-y: auto;
    }

    .rule-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .rule-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      border-radius: 999px;
      padding: 3px 9px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .rule-badge[data-kind="redeem"]       { background: var(--danger-soft); color: var(--danger); }
    .rule-badge[data-kind="bonus_reason"],
    .rule-badge[data-kind="bonus_amount"] { background: rgba(55,47,34,0.07); color: var(--muted); }

    .rule-label-text { flex: 1; font-size: 14px; min-width: 0; }

    .rule-pts-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .rule-order-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .rule-order-btn {
      border: 0.5px solid var(--border-strong);
      background: transparent;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
      color: var(--muted);
      min-width: 22px;
      text-align: center;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .rule-order-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .rule-order-btn:disabled { opacity: 0.18; cursor: default; }

    .rule-delete-btn {
      flex-shrink: 0;
      border: 1px solid transparent;
      background: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--danger);
      white-space: nowrap;
      font-family: inherit;
    }

    .rule-delete-btn:hover { background: var(--danger-soft); }
    .rule-delete-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .rule-inputs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Sub-sections within detail ─────────────────────────────────────────── */

    .sub-section { margin-bottom: 20px; }
    .sub-section:last-child { margin-bottom: 0; }

    .sub-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--hint);
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* ── Inline edit rows ───────────────────────────────────────────────────── */

    .inline-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .inline-edit-row:last-child { border-bottom: none; }

    /* ── Users section (landing) ────────────────────────────────────────────── */

    .users-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 24px;
      margin-top: 24px;
    }

    /* ── Status / empty / loading ───────────────────────────────────────────── */

    .status {
      min-height: 18px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .status.error { color: var(--danger); }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 10px 0;
    }

    .loading-text {
      color: var(--hint);
      font-size: 14px;
      padding: 8px 0;
    }

    .error-text { color: var(--danger); font-size: 14px; }

    /* ── Logo upload ────────────────────────────────────────────────────────── */

    .logo-upload-label {
      cursor: pointer;
    }

    /* ── Debug overlay + header bar ────────────────────────────────────────── */

    #dbg {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999;
      width: 210px;
      background: var(--surface-strong);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .dbg-row   { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .dbg-head  { justify-content: space-between; margin-bottom: 6px; font-weight: 600; color: var(--text); font-size: 10px; }
    .dbg-lbl   { color: var(--hint); width: 34px; flex-shrink: 0; }
    .dbg-val   { flex: 1; color: var(--text); }
    .dbg-time  { color: var(--hint); margin-top: 6px; font-size: 9px; }
    .dbg-ok    { color: var(--accent); }
    .dbg-no    { color: var(--danger); }
    .dbg-err   { color: var(--danger); }
    .dbg-dim   { color: var(--muted); }

    .dbg-btn {
      border: 0.5px solid var(--border-strong);
      background: transparent;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: var(--mono);
      cursor: pointer;
      color: var(--muted);
      line-height: 1.5;
      flex-shrink: 0;
    }

    .dbg-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    #dbgHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(31,106,82,0.18);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .dbg-hleft   { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dbg-hpid    { color: var(--text); font-weight: 500; }
    .dbg-huid    { color: var(--muted); }
    .dbg-hsep    { color: var(--hint); }
    .dbg-hstore  { color: var(--text); }
    .dbg-htime   { color: var(--hint); font-size: 10px; white-space: nowrap; flex-shrink: 0; }

    .dbg-hbadge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      border: 0.5px solid currentColor;
    }
  </style>
</head>
<body>
  <main class="page">

    <div id="dbgHeader">Loading context…</div>

    <!-- ── View: Stores landing ─────────────────────────────────────────────── -->
    <div id="viewStores" class="view">

      <div class="page-header">
        <h1 class="page-title">Stores</h1>
        <div class="page-header-actions">
          <button class="btn-sm" id="toggleUsersBtn">All Users</button>
          <button class="btn-primary" id="addStoreBtn">+ New Store</button>
        </div>
      </div>

      <div id="createStoreForm" class="create-store-form hidden">
        <input type="text" id="newStoreName" class="input input-grow" placeholder="Store name…" />
        <button class="btn-primary" id="createStoreBtn">Create</button>
        <button class="btn-sm" id="cancelNewStoreBtn">Cancel</button>
        <div class="status" id="createStoreStatus"></div>
      </div>

      <div id="storeGrid" class="store-grid"></div>

      <div id="usersSection" class="users-section hidden">
        <div class="section-header">
          <span class="section-title">All Users</span>
        </div>
        <div class="dir-list" id="allUsersList"><p class="loading-text">Loading…</p></div>
      </div>

    </div>

    <!-- ── View: Store detail ────────────────────────────────────────────────── -->
    <div id="viewStore" class="view hidden">

      <div class="back-nav">
        <button class="back-btn" id="backBtn">← Stores</button>
      </div>

      <div id="storeHeader" class="store-header-card">
        <p class="loading-text">Loading…</p>
      </div>

      <section class="detail-section" id="sectionManagers">
        <p class="loading-text">Loading…</p>
      </section>

      <section class="detail-section" id="sectionStaff">
        <p class="loading-text">Loading…</p>
      </section>

      <section class="detail-section" id="sectionMembers">
        <p class="loading-text">Loading…</p>
      </section>

      <section class="detail-section" id="sectionRewards">
        <p class="loading-text">Loading…</p>
      </section>

      <section class="detail-section" id="sectionOutlets">
        <p class="loading-text">Loading…</p>
      </section>

    </div>

  </main>

  <div id="dbg">Loading…</div>

  <script type="module" src="/src/pages/admin/start.js"></script>
</body>
</html>
