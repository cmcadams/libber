<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libber — Staff</title>
  <link rel="manifest" href="/apps/staff/manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.2);
      --text: #1a1a18;
      --text-muted: #888780;
      --text-hint: #b4b2a9;
      --success-bg: #eaf3de;
      --success-border: #639922;
      --success-text: #3b6d11;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font: 'DM Mono', 'Courier New', monospace;
      --font-ui: system-ui, sans-serif;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem 1rem 6rem;
    }

    @media (min-width: 640px) {
      .page {
        max-width: 540px;
        padding: 1.5rem 1rem 6rem;
      }
    }

    @media (min-width: 1024px) {
      .page {
        max-width: 600px;
        padding: 2rem 1rem 6rem;
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0 1rem;
      margin-bottom: 0.75rem;
    }

    .staff-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px 10px;
    }

    .search {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      font-family: var(--font-ui);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search:focus { border-color: var(--border-strong); }
    .search::placeholder { color: var(--text-hint); }

    .member-count-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .member-count {
      font-size: 12px;
      color: var(--text-hint);
    }

    .refresh-btn {
      font-size: 13px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      font-family: var(--font-ui);
      transition: color 0.15s;
    }

    .refresh-btn:hover { color: var(--text); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .customer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      user-select: none;
    }

    .customer-row:hover { background: #f4f4f1; border-color: var(--border-strong); }
    .customer-row:active { transform: scale(0.99); }

    .cust-id {
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .cust-pts {
      font-size: 13px;
      color: var(--text-muted);
    }

    .cust-pts strong {
      color: var(--text);
      font-weight: 500;
    }

    .empty {
      font-size: 14px;
      color: var(--text-hint);
      text-align: center;
      padding: 2rem 0;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .panel {
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 0;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 0.5px solid var(--border);
      border-bottom: none;
    }

    .panel-scroll {
      overflow-y: auto;
      flex: 1;
      padding: 0 1.25rem 2.5rem;
    }

    .panel-handle {
      width: 36px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 2px;
      margin: 14px auto 1.25rem;
      flex-shrink: 0;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }

    .panel-id {
      font-size: 18px;
      font-weight: 500;
      font-family: var(--font);
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .panel-balance {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .panel-balance strong {
      color: var(--text);
      font-weight: 500;
    }

    .close-btn {
      font-size: 22px;
      line-height: 1;
      color: var(--text-hint);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      transition: color 0.1s;
    }

    .close-btn:hover { color: var(--text); }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-hint);
      margin-bottom: 8px;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .quick-btn {
      padding: 12px 6px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      transition: background 0.1s, border-color 0.1s, transform 0.1s;
    }

    .quick-btn:hover { background: #f4f4f1; border-color: var(--border-strong); }
    .quick-btn:active { transform: scale(0.97); }

    .quick-btn .btn-label {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 3px;
    }

    .quick-btn .btn-pts {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .quick-btn.done {
      border-color: var(--success-border);
      background: var(--success-bg);
    }

    .quick-btn.done .btn-label { color: var(--success-text); }
    .quick-btn.done .btn-pts { color: var(--success-text); }

    .divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .bonus-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .bonus-reason-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .bonus-reason-btn {
      padding: 8px 12px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-family: var(--font-ui);
      transition: background 0.1s, border-color 0.1s;
    }

    .bonus-reason-btn:hover { background: #f4f4f1; border-color: var(--border-strong); }

    .bonus-reason-btn.selected {
      background: var(--text);
      border-color: var(--text);
      color: var(--surface);
    }

    .bonus-btn {
      padding: 11px 8px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      font-family: var(--font-ui);
      transition: background 0.1s, border-color 0.1s;
    }

    .bonus-btn:hover { background: #f4f4f1; border-color: var(--border-strong); }

    .bonus-btn.selected {
      background: var(--text);
      border-color: var(--text);
      color: var(--surface);
    }

    .bonus-confirm {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 10px;
    }

    .bonus-confirm-msg {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 10px;
    }

    .bonus-confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .bonus-confirm-cancel {
      padding: 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .bonus-confirm-cancel:hover { background: #f4f4f1; border-color: var(--border-strong); }
    .bonus-confirm-cancel:disabled { opacity: 0.35; cursor: not-allowed; }

    .bonus-confirm-ok {
      padding: 10px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--text);
      color: var(--surface);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .bonus-confirm-ok:hover { opacity: 0.82; }
    .bonus-confirm-ok:disabled { opacity: 0.35; cursor: not-allowed; }

    .adjust-dir-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .adjust-dir-btn {
      padding: 12px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .adjust-dir-btn:hover { background: #f4f4f1; border-color: var(--border-strong); }

    .adjust-dir-btn.selected {
      background: var(--text);
      border-color: var(--text);
      color: var(--surface);
    }

    .adjust-display {
      font-size: 36px;
      font-weight: 500;
      font-family: var(--font);
      color: var(--text);
      text-align: center;
      padding: 14px 0 10px;
      letter-spacing: 0.02em;
    }

    .adjust-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .pad-btn {
      padding: 14px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      text-align: center;
      transition: background 0.1s, border-color 0.1s;
    }

    .pad-btn:hover { background: #f4f4f1; border-color: var(--border-strong); }
    .pad-btn:active { transform: scale(0.96); }

    .reason-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--font-ui);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      margin-bottom: 10px;
      resize: none;
      height: 62px;
      outline: none;
      transition: border-color 0.15s;
    }

    .reason-input:focus { border-color: var(--border-strong); }
    .reason-input::placeholder { color: var(--text-hint); }

    .award-btn {
      width: 100%;
      padding: 13px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .award-btn:not(:disabled):hover { background: #f4f4f1; border-color: var(--border-strong); }
    .award-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .award-btn.success {
      color: var(--success-text);
      border-color: var(--success-border);
      background: var(--success-bg);
    }

    .redeem-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .redeem-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      font-family: var(--font-ui);
      transition: background 0.1s, border-color 0.1s;
      width: 100%;
    }

    .redeem-btn:hover:not(:disabled) { background: #f4f4f1; border-color: var(--border-strong); }
    .redeem-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .redeem-btn-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .redeem-btn-cost {
      font-size: 13px;
      font-family: var(--font);
      color: var(--text-muted);
    }

    .redeem-btn.done {
      border-color: var(--success-border);
      background: var(--success-bg);
    }

    .redeem-btn.done .redeem-btn-label,
    .redeem-btn.done .redeem-btn-cost { color: var(--success-text); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 0.5rem 0;
      cursor: pointer;
    }

    .back-btn:hover { color: var(--text); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cog-btn {
      font-size: 15px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px 6px;
      font-family: var(--font-ui);
      line-height: 1;
      transition: color 0.15s;
    }

    .cog-btn:hover { color: var(--text); }

    .cog-menu {
      margin-bottom: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
    }

    .cog-install-btn {
      width: 100%;
      padding: 10px 14px;
      border: 0.5px solid var(--border-strong);
      background: transparent;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: var(--font-ui);
      cursor: pointer;
      color: var(--text);
      transition: background 0.1s, border-color 0.1s;
    }

    .cog-install-btn:hover { background: #f4f4f1; }

    .cog-instructions {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      font-size: 13px;
      color: var(--text-hint);
      text-align: center;
      padding: 0.75rem 0 0;
      min-height: 1.5rem;
    }

    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .confirm-overlay.open { display: flex; }

    .confirm-dialog {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      width: 100%;
      max-width: 320px;
      border: 0.5px solid var(--border);
    }

    .confirm-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .confirm-detail {
      font-size: 13px;
      color: var(--text-muted);
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 1.25rem;
    }

    .confirm-cancel {
      padding: 11px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .confirm-cancel:hover { background: #f4f4f1; border-color: var(--border-strong); }

    .confirm-ok {
      padding: 11px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--text);
      color: var(--surface);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .confirm-ok:hover { opacity: 0.82; }
  </style>
</head>
<body>
  <div class="page">
    <button class="back-btn" id="backBtn">← My Stores</button>
    <div class="header">
      <span class="staff-badge" id="staffBadge">Staff</span>
      <div class="header-right">
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
        <button class="cog-btn" id="cogBtn" aria-label="Settings">⚙</button>
      </div>
    </div>
    <div class="cog-menu" id="cogMenu" style="display:none"></div>

    <input class="search" type="text" id="search" placeholder="Filter by ID..." autocomplete="off" spellcheck="false" />
    <div class="member-count-row">
      <div class="member-count" id="memberCount"></div>
    </div>
    <div class="customer-list" id="customerList"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel" id="panel">
      <div class="panel-handle"></div>
      <div class="panel-header">
        <div>
          <div class="panel-id" id="panelId"></div>
          <div class="panel-balance">Balance: <strong id="panelBalance"></strong> pts</div>
        </div>
        <button class="close-btn" id="closeBtn">×</button>
      </div>

      <div class="panel-scroll">
        <div id="quickSection">
          <div class="section-label">Quick award</div>
          <div class="quick-btns" id="quickBtns"></div>
        </div>

        <hr class="divider" id="sectionDivider" />

        <div id="bonusSection">
          <div class="section-label">Bonus</div>
          <div class="bonus-reason-btns" id="bonusReasonBtns"></div>
          <div class="bonus-btns" id="bonusBtns"></div>
          <div class="bonus-confirm" id="bonusConfirm" style="display:none">
            <p class="bonus-confirm-msg" id="bonusConfirmMsg"></p>
            <div class="bonus-confirm-actions">
              <button class="bonus-confirm-cancel" id="bonusConfirmCancel">Cancel</button>
              <button class="bonus-confirm-ok" id="bonusConfirmOk">Confirm</button>
            </div>
          </div>
        </div>

        <hr class="divider" id="redeemDivider" style="display:none" />

        <div id="redeemSection" style="display:none">
          <div class="section-label">Redeem</div>
          <div class="redeem-btns" id="redeemBtns"></div>
        </div>

        <hr class="divider" />

        <div id="adjustSection">
          <div class="section-label">Adjust</div>
          <div class="adjust-dir-btns" id="adjustDirBtns">
            <button class="adjust-dir-btn" data-dir="1">+ Add</button>
            <button class="adjust-dir-btn" data-dir="-1">− Deduct</button>
          </div>
          <div class="adjust-display" id="adjustDisplay">0</div>
          <div class="adjust-pad" id="adjustPad">
            <button class="pad-btn" data-key="1">1</button>
            <button class="pad-btn" data-key="2">2</button>
            <button class="pad-btn" data-key="3">3</button>
            <button class="pad-btn" data-key="4">4</button>
            <button class="pad-btn" data-key="5">5</button>
            <button class="pad-btn" data-key="6">6</button>
            <button class="pad-btn" data-key="7">7</button>
            <button class="pad-btn" data-key="8">8</button>
            <button class="pad-btn" data-key="9">9</button>
            <button class="pad-btn" data-key="clear">C</button>
            <button class="pad-btn" data-key="0">0</button>
            <button class="pad-btn" data-key="back">⌫</button>
          </div>
          <textarea class="reason-input" id="adjustReason" placeholder="Reason — leave blank to use 'Adjustment'"></textarea>
          <button class="award-btn" id="adjustBtn" disabled>Apply adjustment</button>
        </div>

        <div id="status"></div>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
      <div class="confirm-title" id="confirmTitle"></div>
      <div class="confirm-detail" id="confirmDetail"></div>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirmCancel">Cancel</button>
        <button class="confirm-ok" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/staff/page.js"></script>
</body>
</html>
