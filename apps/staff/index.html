<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libber Staff</title>
  <link rel="manifest" href="/apps/staff/manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f0ea;
      --surface: #fffdf8;
      --border: rgba(30, 30, 25, 0.14);
      --border-strong: rgba(30, 30, 25, 0.34);
      --text: #1d1a14;
      --muted: #736b5d;
      --accent: #945f20;
      --accent-soft: #f5e6d1;
      --danger: #a33d2f;
      --mono: 'DM Mono', monospace;
      --ui: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      font-family: var(--ui);
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(148, 95, 32, 0.10), transparent 24%),
        linear-gradient(180deg, #f8f4ee 0%, var(--bg) 100%);
      padding: 24px;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 0.95;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sub, .panel p, .status {
      color: var(--muted);
      font-size: 14px;
    }

    .id-block {
      margin-top: 16px;
      text-align: center;
    }

    .id-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .id-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .picker {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
      margin-top: 14px;
    }

    .pick-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
    }

    .pick-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pick-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pick-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .pick-sub {
      display: block;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .apply-action {
      margin-top: 14px;
    }

    .pending-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 2px 8px;
      margin-top: 4px;
    }

    .pick-card.pending {
      border-color: var(--accent);
    }

    .apply-btn {
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: white;
      padding: 14px 20px;
      font-size: 15px;
      cursor: pointer;
    }

    .apply-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .status.error {
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      padding: 16px 4px;
    }

    .manager-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: white;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }

    .manager-btn:hover { opacity: 0.85; }

    .hero-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .cog-btn {
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .cog-btn:hover { color: var(--text); }

    .cog-menu {
      margin-top: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .cog-install-btn {
      width: 100%;
      padding: 10px 16px;
      border: 1.5px solid var(--border-strong);
      background: transparent;
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.15s, color 0.15s;
    }

    .cog-install-btn:hover { border-color: var(--accent); color: var(--accent); }

    .cog-instructions {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .refresh-btn {
      font-size: 16px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s, transform 0.3s;
    }

    .refresh-btn:hover { color: var(--text); }
    .refresh-btn.loading { animation: spin 0.7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="hero-header">
        <div>
          <h1>Staff.</h1>
          <p class="sub">Pick a store to open the staff tools, or apply to join a new one.</p>
        </div>
        <button class="cog-btn" id="cogBtn" aria-label="Settings">⚙</button>
      </div>
      <div class="id-block">
        <span class="id-label">Your ID</span>
        <span class="id-value" id="myId">Loading...</span>
      </div>
      <div class="cog-menu" id="cogMenu" style="display:none"></div>
    </section>

    <section class="panel" id="managerSection" style="display:none">
      <button class="manager-btn" id="managerBtn">Manager tools</button>
    </section>

    <section class="panel" id="staffStoresSection" style="display:none">
      <div class="panel-header-row">
        <h2>Your stores</h2>
        <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
      </div>
      <p>Stores you're approved to work at.</p>
      <div class="picker" id="staffStoreList"></div>
    </section>

    <section class="panel">
      <h2>Apply for a new store</h2>
      <p>Pick a store below. The manager will approve you.</p>
      <div class="picker" id="storeList">
        <p class="empty">Loading stores...</p>
      </div>
      <div class="apply-action" id="applyAction" style="display:none">
        <button class="apply-btn" id="applyBtn">Apply for staff</button>
        <p class="status" id="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="/src/pages/staff/start.js"></script>
</body>
</html>
