<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libber Staff</title>
  <link rel="manifest" href="/apps/staff/manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; }

    :root {
      --bg: #f3f0ea;
      --surface: #fffdf8;
      --border: rgba(30, 30, 25, 0.14);
      --border-strong: rgba(30, 30, 25, 0.34);
      --text: #1d1a14;
      --muted: #736b5d;
      --hint: rgba(30, 30, 25, 0.38);
      --accent: #945f20;
      --accent-soft: #f5e6d1;
      --mono: 'DM Mono', monospace;
      --ui: system-ui, sans-serif;
    }

    body {
      font-family: var(--ui);
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(148, 95, 32, 0.10), transparent 24%),
        linear-gradient(180deg, #f8f4ee 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem 1rem 3rem;
    }

    @media (min-width: 640px) {
      .page { padding: 1.5rem 1rem 3rem; }
    }

    /* ── Header — identical structure to customer page ──────────────────── */

    .header {
      position: relative;
      margin-bottom: 1.25rem;
      padding-bottom: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .header-id { text-align: center; }

    .id-label {
      font-size: 12px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 6px;
    }

    #myId {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .manage-btn {
      position: absolute;
      top: 0;
      right: 0;
      padding: 6px 14px;
      border: 0.5px solid var(--border-strong);
      border-radius: 999px;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer;
      min-height: 32px;
      transition: color 0.15s, border-color 0.15s;
    }

    .manage-btn:hover { color: var(--text); border-color: var(--text); }

    /* ── Store list ─────────────────────────────────────────────────────── */

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .refresh-btn {
      padding: 6px 10px;
      background: transparent;
      border: 0.5px solid var(--border-strong);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      min-width: 36px;
      min-height: 36px;
      transition: color 0.2s;
    }

    .refresh-btn:hover { color: var(--text); }
    .refresh-btn.loading { animation: spin 0.7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .store-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .store-card {
      width: 100%;
      text-align: left;
      border: 0.5px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }

    .store-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .store-name {
      font-size: 15px;
      font-weight: 500;
    }

    .empty {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="header-id">
        <span class="id-label">Your ID</span>
        <span id="myId">Loading...</span>
      </div>
      <button class="manage-btn" id="managerBtn" style="display:none">Manage</button>
    </div>

    <div id="staffStoresSection" style="display:none">
      <div class="section-header">
        <span class="section-title">Your stores</span>
        <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
      </div>
      <div class="store-list" id="staffStoreList"></div>
    </div>
  </div>

  <script type="module" src="/src/pages/staff/start.js"></script>
</body>
</html>
