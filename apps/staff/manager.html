<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gotya Manager</title>
  <link rel="manifest" href="/apps/staff/manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; }

    :root {
      --bg: #eef4ef;
      --surface: #fcfffc;
      --border: rgba(22, 40, 28, 0.14);
      --border-strong: rgba(22, 40, 28, 0.34);
      --text: #152018;
      --muted: #627168;
      --hint: rgba(22, 40, 28, 0.38);
      --accent: #1f6a52;
      --accent-soft: #deefe8;
      --danger: #a33d2f;
      --mono: 'DM Mono', monospace;
      --ui: system-ui, sans-serif;
    }

    body {
      font-family: var(--ui);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31, 106, 82, 0.09), transparent 26%),
        linear-gradient(180deg, #f5faf6 0%, var(--bg) 100%);
      min-height: 100vh;
      padding: 1rem 1rem 3rem;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Header — identical structure to customer page ──────────────────── */

    .header {
      position: relative;
      padding-bottom: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .header-id { text-align: center; }

    .id-label {
      font-size: 12px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 6px;
    }

    #myId {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .back-btn {
      position: absolute;
      top: 0;
      right: 0;
      padding: 6px 14px;
      border: 0.5px solid var(--border-strong);
      border-radius: 999px;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer;
      min-height: 32px;
      transition: color 0.15s, border-color 0.15s;
    }

    .back-btn:hover { color: var(--text); border-color: var(--text); }

    /* ── Grid ───────────────────────────────────────────────────────────── */

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: 0.95fr 1.15fr; }
    }

    /* ── Panels ─────────────────────────────────────────────────────────── */

    .panel {
      background: rgba(252, 255, 252, 0.95);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .panel-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .panel-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    /* ── Store picker ───────────────────────────────────────────────────── */

    .picker {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      max-height: 420px;
      overflow: auto;
    }

    .pick-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.1s, background 0.1s;
    }

    .pick-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pick-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* ── Refresh ────────────────────────────────────────────────────────── */

    .refresh-btn {
      flex-shrink: 0;
      padding: 6px 10px;
      background: transparent;
      border: 0.5px solid var(--border-strong);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      min-width: 36px;
      min-height: 36px;
      transition: color 0.2s;
    }

    .refresh-btn:hover { color: var(--text); }
    .refresh-btn.loading { animation: spin 0.7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Selected store name ────────────────────────────────────────────── */

    .selected-store-name {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Member list ────────────────────────────────────────────────────── */

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      max-height: 480px;
      overflow: auto;
    }

    .member-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      padding: 12px 14px;
    }

    .member-card.is-staff {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .member-id {
      font-family: var(--mono);
      font-size: 13px;
    }

    .staff-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--accent);
      background: white;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Action buttons ─────────────────────────────────────────────────── */

    .promote-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: white;
      padding: 8px 14px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .promote-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .demote-btn {
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .demote-btn:hover { color: var(--danger); border-color: var(--danger); }
    .demote-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status / empty ─────────────────────────────────────────────────── */

    .status {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
      margin-top: 6px;
    }

    .status.error { color: var(--danger); }

    .empty {
      font-size: 14px;
      color: var(--muted);
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <div class="header-id">
        <span class="id-label">Manager ID</span>
        <span id="myId">Loading...</span>
      </div>
      <button class="back-btn" id="staffPageBtn">← Staff</button>
    </div>

    <section class="grid">
      <section class="panel">
        <h2>Your stores</h2>
        <p class="panel-desc">Select a store to manage its members.</p>
        <div class="picker" id="storeList">
          <p class="empty">Loading managed stores...</p>
        </div>
      </section>

      <section class="panel" id="membersPanel" style="display:none">
        <div class="panel-header-row">
          <div>
            <h2>Members</h2>
            <p class="selected-store-name" id="selectedStore"></p>
          </div>
          <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
        </div>
        <p class="status" id="status"></p>
        <div class="member-list" id="memberList"></div>
      </section>
    </section>
  </main>

  <script type="module" src="/src/pages/manager/start.js"></script>
</body>
</html>
