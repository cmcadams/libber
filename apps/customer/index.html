<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libber — My Points</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; }

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.2);
      --text: #1a1a18;
      --text-muted: #888780;
      --text-hint: #b4b2a9;
      --success-bg: #eaf3de;
      --success-border: #639922;
      --success-text: #3b6d11;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font: 'DM Mono', 'Courier New', monospace;
      --font-ui: system-ui, sans-serif;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem 1rem 3rem;
    }

    @media (min-width: 640px) {
      .page {
        max-width: 540px;
        padding: 1.5rem 1rem 3rem;
      }
    }

    @media (min-width: 1024px) {
      .page {
        max-width: 600px;
        padding: 2rem 1rem 3rem;
      }
    }

    .header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .header-id {
      flex: 1;
      min-width: 0;
    }

    .user-id {
      font-size: 12px;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 6px;
    }

    #user-id {
      font-family: var(--font);
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .refresh-btn {
      padding: 10px 14px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
      margin-left: auto;
      min-width: 44px;
      min-height: 44px;
    }

    .refresh-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .refresh-btn:active {
      transform: scale(0.95);
    }

    .refresh-btn.loading {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .section-title {
      font-size: 12px;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .store-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .store-card {
      display: flex;
      flex-direction: column;
      padding: 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      transition: border-color 0.1s, background 0.1s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .store-card:hover {
      background: #f4f4f1;
      border-color: var(--border-strong);
    }

    .store-card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .store-card-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chevron {
      color: var(--text-hint);
      font-size: 18px;
      line-height: 1;
      transition: transform 0.2s;
      display: inline-block;
    }

    .store-card.open .chevron {
      transform: rotate(90deg);
    }

    .store-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
    }

    .store-points {
      font-size: 16px;
      font-weight: 500;
      color: var(--success-text);
      font-family: var(--font);
    }

    .store-history {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rules-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-hint);
      font-weight: 500;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .rule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      padding: 3px 0;
    }

    .rule-label {
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }

    .rule-pts {
      font-family: var(--font);
      color: var(--success-text);
      white-space: nowrap;
    }

    .rules-divider {
      border-top: 0.5px solid var(--border);
      margin: 10px 0;
    }

    .history-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .history-reason {
      flex: 1;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-pts {
      font-family: var(--font);
      color: var(--success-text);
      white-space: nowrap;
    }

    .history-date {
      color: var(--text-hint);
      font-size: 13px;
      white-space: nowrap;
    }

    .history-empty {
      font-size: 14px;
      color: var(--text-hint);
    }

    .empty {
      font-size: 14px;
      color: var(--text-hint);
      text-align: center;
      padding: 2rem 0;
    }

    #stores-section {
      margin-top: 1rem;
    }

    .available-stores {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .store-join-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .store-join-card:hover {
      background: #f4f4f1;
      border-color: var(--border-strong);
    }

    .store-join-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .join-btn {
      font-size: 14px;
      padding: 10px 16px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      min-height: 44px;
    }

    .join-btn:hover {
      background: #f4f4f1;
      border-color: var(--border-strong);
    }

    .show-staff-btn {
      padding: 10px 14px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-ui);
      font-weight: 500;
      transition: color 0.2s, border-color 0.2s;
      min-width: 44px;
      min-height: 44px;
      white-space: nowrap;
    }

    .show-staff-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .staff-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .staff-overlay.active {
      display: flex;
    }

    .staff-overlay-label {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .staff-overlay-id {
      font-family: var(--font);
      font-size: clamp(52px, 14vw, 140px);
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 0 24px;
    }

    .staff-overlay-done {
      margin-top: 12px;
      padding: 14px 36px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: var(--radius-md);
      color: rgba(255,255,255,0.6);
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      transition: border-color 0.2s, color 0.2s;
    }

    .staff-overlay-done:hover {
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="header-id">
        <span class="user-id">Your ID</span>
        <span id="user-id">Loading...</span>
      </div>
      <button id="show-staff-btn" class="show-staff-btn">Show Staff</button>
      <button id="refresh-btn" class="refresh-btn" title="Refresh points">↻</button>
    </div>

    <div id="staff-overlay" class="staff-overlay">
      <span class="staff-overlay-label">Your ID</span>
      <span id="staff-overlay-id" class="staff-overlay-id"></span>
      <button id="staff-overlay-done" class="staff-overlay-done">Done</button>
    </div>

    <div id="user-stores">
      <p class="empty">Loading your points...</p>
    </div>

    <div id="stores-section">
      <h2 class="section-title">Join a store</h2>
      <div id="stores-list">Loading...</div>
    </div>
  </div>

  <script type="module" src="/src/pages/customer/main.js"></script>
</body>
</html>
