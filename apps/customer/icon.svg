<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f1f40" rx="100"/>
  <!-- G: center (256,256), radius 148, opens upper-right ~-50deg -->
