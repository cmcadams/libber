  <path
    d="M 351 143 A 148 148 0 1 0 404 256 L 256 256"
    fill="none"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Green checkmark inside G -->
  <polyline
    points="200,258 250,308 346,194"
    fill="none"
    stroke="#25d366"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
